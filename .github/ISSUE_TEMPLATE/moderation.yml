name: Request moderation
description: Request a moderation action in a public project discussion.
title: "[Moderation] "
body:
  - type: markdown
    attributes:
      value: |
        This report is public. Do not include personal information, private messages or private evidence.
        Link to an existing public discussion instead of repeating abusive content.
        Read the [community conduct rules](https://github.com/vzeol/DeployCraft/blob/main/CODE_OF_CONDUCT.md).
        For violations of GitHub's policies, you can use GitHub's reporting tools instead.
  - type: input
    id: discussion
    attributes:
      label: Public discussion link (optional)
      description: Link to an issue, pull request or comment already visible in this repository.
  - type: textarea
    id: action
    attributes:
      label: What moderation action are you requesting?
      description: Keep it brief and leave out private information. English or French is welcome.
    validations:
      required: true
