# Checks every PR and every merge into main: locked restore (packages.lock.json),
# build, tests, formatting. Windows required (WPF, Windows service, .NET Framework runner).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore (locked mode)
        run: dotnet restore DeployCraft.slnx

      - name: Build
        run: dotnet build DeployCraft.slnx --no-restore -c Release -warnaserror

      - name: Tests
        run: dotnet test DeployCraft.slnx --no-build -c Release

      - name: Formatting
        run: dotnet format DeployCraft.slnx --verify-no-changes --no-restore
